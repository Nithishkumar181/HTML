<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
    body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f4f4f4;
    margin: 0;
    background-color: aquamarine;
    
}

.calculator {
    background-color: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

#display {
    width: 160px;
    height: 40px;
    text-align: right;
    font-size: 20px;
    margin-bottom: 20px;
    background-color: greenyellow;
}

button {
    width: 40px;
    height: 40px;
    font-size: 18px;
    margin: 5px;
    cursor: pointer;
    background-color: lightgreen;
}

button:hover {
    background-color: #ddd;
}

</style>
<script>
    let currentValue = '';
let currentOperation = null;
let previousValue = '';

function appendValue(value) {
    currentValue += value;
    document.getElementById('display').value = currentValue;
}

function setOperation(operation) {
    if (currentValue === '') return;
    if (previousValue == '') {
        calculate();
    }
    currentOperation = operation;
    previousValue = currentValue;
    currentValue = '';
}

function clearDisplay() {
    currentValue = '';
    previousValue = '';
    currentOperation = null;
    document.getElementById('display').value = '';
}

function calculate() {
    if (previousValue === '' || currentValue === '') return;
    let result;
    const prev = parseFloat(previousValue);
    const curr = parseFloat(currentValue);

    switch (currentOperation) {
        case '+':
            result = prev + curr;
            break;
        case '-':
            result = prev - curr;
            break;
        case '*':
            result = prev * curr;
            break;
        case '/':
            result = prev / curr;
            break;
        default:
            return;
    }
    currentValue = result.toString();
    previousValue = '';
    currentOperation = null;
    document.getElementById('display').value = currentValue;
}
</script>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" disabled />
        <div>
            <button class="btn" onclick="appendValue('1')">1</button>
            <button class="btn" onclick="appendValue('2')">2</button>
            <button class="btn" onclick="appendValue('3')">3</button>
            <button style="background-color: orange;" class="btn" onclick="setOperation('+')">+</button>
        </div>
        <div>
            <button class="btn" onclick="appendValue('4')">4</button>
            <button class="btn" onclick="appendValue('5')">5</button>
            <button class="btn" onclick="appendValue('6')">6</button>
            <button style="background-color: orange;" class="btn" onclick="setOperation('-')">-</button>
        </div>
        <div>
            <button class="btn" onclick="appendValue('7')">7</button>
            <button class="btn" onclick="appendValue('8')">8</button>
            <button class="btn" onclick="appendValue('9')">9</button>
            <button style="background-color: orange;" class="btn" onclick="setOperation('*')">*</button>
        </div>
        <div>
            <button class="btn" onclick="appendValue('0')">0</button>
            <button style="background-color: orange;" class="btn" onclick="clearDisplay()">C</button>
            <button style="background-color: orange;" class="btn" onclick="calculate()">=</button>
            <button style="background-color: orange;" class="btn" onclick="setOperation('/')">/</button>
        </div>
    </div>
</body>
</html>
